<!DOCTYPE html>
<html lang="en" th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kartzo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --secondary-color: #10B981;
            --accent-color: #F59E0B;
            --danger-color: #EF4444;
            --dark-color: #111827;
            --gray-color: #6B7280;
            --light-gray: #F3F4F6;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-color);
        }

        .navbar {
            background: linear-gradient(to right, var(--primary-color), var(--primary-hover));
            padding: 1rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--white) !important;
        }

        .dashboard-header {
            margin: 2rem 0;
        }

        .kpi-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
            height: 100%;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-right: 1.5rem;
        }

        .icon-revenue { background: rgba(16, 185, 129, 0.1); color: var(--secondary-color); }
        .icon-orders { background: rgba(79, 70, 229, 0.1); color: var(--primary-color); }
        .icon-users { background: rgba(245, 158, 11, 0.1); color: var(--accent-color); }
        .icon-products { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            color: var(--dark-color);
        }

        .kpi-label {
            font-size: 0.9rem;
            color: var(--gray-color);
            margin: 0;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-container {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
            margin-bottom: 3rem;
        }

        .table th {
            font-weight: 600;
            color: var(--gray-color);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--light-gray);
            padding: 1rem;
        }

        .table td {
            padding: 1rem;
            vertical-align: middle;
            color: var(--dark-color);
            border-bottom: 1px solid var(--light-gray);
        }

        .badge-status {
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-paid { background: rgba(16, 185, 129, 0.1); color: var(--secondary-color); }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--accent-color); }
        .status-cancelled { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); }

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-bag-heart-fill me-2"></i>Kartzo Admin
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a href="/admin/orders" class="btn btn-outline-light"><i class="bi bi-box-seam"></i> Orders</a>
                <a href="/admin/add-product" class="btn btn-warning"><i class="bi bi-plus-lg"></i> Add Product</a>
                <a href="/admin/coupons" class="btn btn-outline-light"><i class="bi bi-ticket-perforated"></i> Coupons</a>
                <a href="/" class="btn btn-outline-light"><i class="bi bi-shop"></i> View Store</a>
                <a href="/logout" class="btn btn-light"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header d-flex justify-content-between align-items-center">
            <h2 class="fw-bold mb-0">Analytics Overview</h2>
            <button class="btn btn-outline-secondary btn-sm" onclick="location.reload();">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-6 col-lg-3">
                <div class="kpi-card">
                    <div class="kpi-icon icon-revenue">
                        <i class="bi bi-currency-rupee"></i>
                    </div>
                    <div>
                        <p class="kpi-label">Total Revenue</p>
                        <h3 class="kpi-value" th:text="${'₹' + #numbers.formatDecimal(dashboardData.totalRevenue, 0, 2)}"></h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="kpi-card">
                    <div class="kpi-icon icon-orders">
                        <i class="bi bi-bag-check"></i>
                    </div>
                    <div>
                        <p class="kpi-label">Total Orders</p>
                        <h3 class="kpi-value" th:text="${dashboardData.totalOrders}"></h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="kpi-card">
                    <div class="kpi-icon icon-users">
                        <i class="bi bi-people"></i>
                    </div>
                    <div>
                        <p class="kpi-label">Active Users</p>
                        <h3 class="kpi-value" th:text="${dashboardData.totalUsers}"></h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="kpi-card">
                    <div class="kpi-icon icon-products">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div>
                        <p class="kpi-label">Total Products</p>
                        <h3 class="kpi-value" th:text="${dashboardData.totalProducts}"></h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Orders Table -->
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Recent Orders</h4>
                <a href="/admin/orders" class="btn btn-sm btn-outline-primary">View All Orders <i class="bi bi-arrow-right ms-1"></i></a>
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${dashboardData.recentOrders}">
                            <td><span class="fw-bold" th:text="${'#' + order.id}"></span></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="ms-0">
                                        <p class="mb-0 fw-medium" th:text="${order.user.name}"></p>
                                        <small class="text-muted" th:text="${order.user.email}"></small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}"></td>
                            <td class="fw-semibold" th:text="${'â‚¹' + #numbers.formatDecimal(order.totalAmount, 0, 2)}"></td>
                            <td>
                                <span class="badge-status" 
                                      th:classappend="${order.status == 'PAID' ? 'status-paid' : (order.status == 'PENDING' ? 'status-pending' : 'status-cancelled')}"
                                      th:text="${order.status}">
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${dashboardData.recentOrders.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No orders received yet
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
