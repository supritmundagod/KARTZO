<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Kartzo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --secondary-color: #10B981;
            --dark-color: #111827;
            --gray-color: #6B7280;
            --light-gray: #F3F4F6;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-color);
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            padding: 3rem 0;
            margin-bottom: -4rem;
            border-radius: 0 0 2rem 2rem;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background-color: var(--white);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .nav-pills .nav-link {
            color: var(--gray-color);
            font-weight: 500;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.5rem;
            text-align: left;
        }

        .nav-pills .nav-link.active {
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary-color);
        }

        .nav-pills .nav-link i {
            width: 24px;
            text-align: center;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #E5E7EB;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .back-btn {
            color: var(--white);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: absolute;
            top: 2rem;
            left: 2rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-4px);
            color: var(--white);
        }
    </style>
</head>

<body>

    <a href="/" class="back-btn">
        <i class="bi bi-arrow-left-short fs-4"></i>
        <span>Store</span>
    </a>

    <!-- Profile Header -->
    <div class="profile-header text-center">
        <div class="container">
            <div class="profile-avatar mb-3">
                <span th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}"></span>
            </div>
            <h2 class="fw-bold mb-1" th:text="${user.name}"></h2>
            <p class="text-white-50 mb-0" th:text="${user.email}"></p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mt-5 pt-5 mb-5">
        
        <div th:if="${session.success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${session.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span th:text="${#session.removeAttribute('success')}" style="display:none"></span>
        </div>

        <div th:if="${session.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${session.error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span th:text="${#session.removeAttribute('error')}" style="display:none"></span>
        </div>

        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-4 col-lg-3 mb-4">
                <div class="card h-100">
                    <div class="card-body p-3">
                        <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                            <button class="nav-link active" id="v-pills-overview-tab" data-bs-toggle="pill" data-bs-target="#v-pills-overview" type="button" role="tab">
                                <i class="bi bi-person-badge me-2"></i> Account Overview
                            </button>
                            <button class="nav-link" id="v-pills-edit-tab" data-bs-toggle="pill" data-bs-target="#v-pills-edit" type="button" role="tab">
                                <i class="bi bi-pencil-square me-2"></i> Edit Profile
                            </button>
                            <button class="nav-link" id="v-pills-security-tab" data-bs-toggle="pill" data-bs-target="#v-pills-security" type="button" role="tab">
                                <i class="bi bi-shield-lock me-2"></i> Security
                            </button>
                            <a href="/logout" class="nav-link text-danger mt-3 border-top pt-3 rounded-0">
                                <i class="bi bi-box-arrow-right me-2"></i> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-md-8 col-lg-9">
                <div class="card h-100">
                    <div class="card-body p-4 p-lg-5">
                        <div class="tab-content" id="v-pills-tabContent">
                            
                            <!-- Overview Tab -->
                            <div class="tab-pane fade show active" id="v-pills-overview" role="tabpanel">
                                <h4 class="fw-bold mb-4">Account Overview</h4>
                                <div class="row g-4">
                                    <div class="col-sm-6">
                                        <p class="text-muted mb-1 small text-uppercase fw-semibold">Full Name</p>
                                        <p class="fs-5 fw-medium mb-0" th:text="${user.name}"></p>
                                    </div>
                                    <div class="col-sm-6">
                                        <p class="text-muted mb-1 small text-uppercase fw-semibold">Email Address</p>
                                        <p class="fs-5 fw-medium mb-0" th:text="${user.email}"></p>
                                    </div>
                                    <div class="col-sm-6">
                                        <p class="text-muted mb-1 small text-uppercase fw-semibold">Mobile Number</p>
                                        <p class="fs-5 fw-medium mb-0" th:text="${user.mobile != null ? user.mobile : 'Not provided'}"></p>
                                    </div>
                                </div>
                            </div>

                            <!-- Edit Profile Tab -->
                            <div class="tab-pane fade" id="v-pills-edit" role="tabpanel">
                                <h4 class="fw-bold mb-4">Edit Profile</h4>
                                <form th:action="@{/user/update-profile}" method="post">
                                    <div class="mb-4">
                                        <label class="form-label fw-medium">Full Name</label>
                                        <input type="text" class="form-control" name="name" th:value="${user.name}" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-medium">Email Address (Read-Only)</label>
                                        <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                                        <div class="form-text">Your email address cannot be changed.</div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-medium">Mobile Number</label>
                                        <input type="text" class="form-control" name="mobile" th:value="${user.mobile}" pattern="[0-9]{10}">
                                    </div>
                                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                                </form>
                            </div>

                            <!-- Security Tab -->
                            <div class="tab-pane fade" id="v-pills-security" role="tabpanel">
                                <h4 class="fw-bold mb-4">Security Settings</h4>
                                <form th:action="@{/user/change-password}" method="post">
                                    <div class="mb-4">
                                        <label class="form-label fw-medium">Current Password</label>
                                        <input type="password" class="form-control" name="oldPassword" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-medium">New Password</label>
                                        <input type="password" class="form-control" name="newPassword" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-medium">Confirm New Password</label>
                                        <input type="password" class="form-control" name="confirmPassword" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary px-4">Update Password</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
