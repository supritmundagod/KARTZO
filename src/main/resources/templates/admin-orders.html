<!DOCTYPE html>
<html lang="en" th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Kartzo Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --dark-color: #111827;
            --light-gray: #F3F4F6;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-color);
        }

        .navbar {
            background: linear-gradient(to right, var(--primary-color), var(--primary-hover));
            padding: 1rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            color: white !important;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            color: #6B7280;
        }

        .table td {
            vertical-align: middle;
        }

        .status-select {
            min-width: 130px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-bag-heart-fill me-2"></i>Kartzo Admin
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a href="/admin/dashboard" class="btn btn-outline-light"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="/logout" class="btn btn-light"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <div th:if="${session.success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${session.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span th:text="${#session.removeAttribute('success')}" style="display:none"></span>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card h-100">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">All Orders</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer Info</th>
                                        <th>Delivery Address</th>
                                        <th>Date</th>
                                        <th>Total Amount</th>
                                        <th>Update Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td><span class="fw-bold text-primary" th:text="${'#' + order.id}"></span></td>
                                        <td>
                                            <div class="fw-medium" th:text="${order.user.name}"></div>
                                            <div class="text-muted small" th:text="${order.user.email}"></div>
                                            <div class="text-muted small" th:text="${order.user.mobile}"></div>
                                        </td>
                                        <td style="max-width: 250px;">
                                            <div class="text-truncate" th:title="${order.deliveryAddress}" th:text="${order.deliveryAddress}"></div>
                                        </td>
                                        <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}"></td>
                                        <td class="fw-bold">₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 2)}"></span></td>
                                        <td>
                                            <form th:action="@{/admin/update-order-status}" method="post" class="d-flex gap-2">
                                                <input type="hidden" name="orderId" th:value="${order.id}">
                                                <select name="status" class="form-select form-select-sm status-select" 
                                                        th:classappend="${order.status == 'DELIVERED' ? 'bg-success text-white' : (order.status == 'CANCELLED' ? 'bg-danger text-white' : '')}">
                                                    <option value="PAID" th:selected="${order.status == 'PAID'}">Paid (Pending)</option>
                                                    <option value="PROCESSING" th:selected="${order.status == 'PROCESSING'}">Processing</option>
                                                    <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">Shipped</option>
                                                    <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">Delivered</option>
                                                    <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Cancelled</option>
                                                </select>
                                                <button type="submit" class="btn btn-sm btn-primary">Update</button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${orders.empty}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            <h5>No orders found.</h5>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
