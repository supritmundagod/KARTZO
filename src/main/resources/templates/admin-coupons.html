<!DOCTYPE html>
<html lang="en" th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Coupons - Kartzo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --dark-color: #111827;
            --light-gray: #F3F4F6;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-color);
        }

        .navbar {
            background: linear-gradient(to right, var(--primary-color), var(--primary-hover));
            padding: 1rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            color: white !important;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            color: #6B7280;
        }

        .table td {
            vertical-align: middle;
        }

        .coupon-code {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            background: rgba(79, 70, 229, 0.1);
            padding: 0.3rem 0.6rem;
            border-radius: 0.4rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-bag-heart-fill me-2"></i>Kartzo Admin
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a href="/admin/dashboard" class="btn btn-outline-light"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="/logout" class="btn btn-light"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <div th:if="${session.success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${session.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span th:text="${#session.removeAttribute('success')}" style="display:none"></span>
        </div>

        <div class="row">
            <!-- Add Coupon Form -->
            <div class="col-lg-4 mb-4">
                <div class="card h-100">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">Create Coupon</h4>
                        <form th:action="@{/admin/add-coupon}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Coupon Code</label>
                                <div class="input-group">
                                    <input type="text" name="code" id="couponCodeInput" class="form-control" required placeholder="e.g. SUMMER20" style="text-transform: uppercase;">
                                    <button type="button" class="btn btn-outline-primary" id="generateCodeBtn" title="Auto-generate a coupon code">
                                        <i class="bi bi-shuffle me-1"></i> Generate
                                    </button>
                                </div>
                                <small class="text-muted mt-1 d-block">Type your own or click Generate for a random code.</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Discount Percentage (%)</label>
                                <input type="number" step="0.01" name="discountPercentage" class="form-control" required min="1" max="100" placeholder="e.g. 20">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Max Discount Amount (₹)</label>
                                <input type="number" step="0.01" name="maxDiscountAmount" class="form-control" required min="1" placeholder="e.g. 500">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-medium">Minimum Order Amount (₹)</label>
                                <input type="number" step="0.01" name="minOrderAmount" class="form-control" required min="1" placeholder="e.g. 1000">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Create Coupon</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Coupons List -->
            <div class="col-lg-8">
                <div class="card h-100">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">Active Coupons</h4>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Code</th>
                                        <th>Discount</th>
                                        <th>Max (â‚¹)</th>
                                        <th>Min Order (â‚¹)</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="coupon : ${coupons}">
                                        <td><span class="coupon-code" th:text="${coupon.code}"></span></td>
                                        <td th:text="${coupon.discountPercentage + '%'}"></td>
                                        <td th:text="${coupon.maxDiscountAmount}"></td>
                                        <td th:text="${coupon.minOrderAmount}"></td>
                                        <td>
                                            <span class="badge bg-success" th:if="${coupon.active}">Active</span>
                                            <span class="badge bg-secondary" th:if="${!coupon.active}">Inactive</span>
                                        </td>
                                        <td>
                                            <a th:href="'/admin/delete-coupon/' + ${coupon.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this coupon?');">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${coupons.empty}">
                                        <td colspan="6" class="text-center py-4 text-muted">No coupons created yet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('generateCodeBtn').addEventListener('click', function() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'KZ-';
            const array = new Uint8Array(6);
            crypto.getRandomValues(array);
            for (let i = 0; i < 6; i++) {
                code += chars[array[i] % chars.length];
            }
            const input = document.getElementById('couponCodeInput');
            input.value = code;
            input.focus();

            // Brief visual feedback
            const btn = this;
            btn.classList.replace('btn-outline-primary', 'btn-success');
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i> Done';
            setTimeout(() => {
                btn.classList.replace('btn-success', 'btn-outline-primary');
                btn.innerHTML = '<i class="bi bi-shuffle me-1"></i> Generate';
            }, 800);
        });
    </script>
</body>
</html>
