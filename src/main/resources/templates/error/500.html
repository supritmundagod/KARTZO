<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle != null ? errorTitle : 'Error'}">Error - Kartzo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .error-container {
            background-color: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .error-icon {
            font-size: 5rem;
            color: #EF4444;
            margin-bottom: 1rem;
        }

        .error-title {
            font-weight: bold;
            color: #111827;
            margin-bottom: 1rem;
        }

        .error-message {
            color: #6B7280;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background-color: #4F46E5;
            border-color: #4F46E5;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #4338CA;
            border-color: #4338CA;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <i class="bi bi-exclamation-triangle error-icon"></i>
        <h1 class="error-title" th:text="${errorTitle != null ? errorTitle : 'Oops! Something went wrong'}">Oops! Something went wrong</h1>
        <p class="error-message" th:text="${errorMessage != null ? errorMessage : 'We encountered an unexpected error while processing your request. Please try again.'}">We encountered an unexpected error while processing your request.</p>
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house-door me-2"></i>Return to Home
        </a>
    </div>
</body>

</html>
